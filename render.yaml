services:
  - type: web
    name: workforcex-digital-twin
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: workforcex-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SQLITE_DB_PATH
        value: /var/data/workforce.db
